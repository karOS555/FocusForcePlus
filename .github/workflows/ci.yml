name: Build and test

# Runs on every pull request, Dependabot's included, and on pushes to main: unit
# tests, lint and a debug build. It needs no secrets and publishes nothing.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests, lint and a debug build
        run: |
          chmod +x ./gradlew
          ./gradlew :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --no-daemon

      - name: Keep the reports when something fails
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: reports
          path: app/build/reports/
